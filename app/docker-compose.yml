services:
  mysql:
    image: mysql:9.7
    container_name: mysql-cartoes
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nexus}
      MYSQL_DATABASE: db_cartoes
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema_cartoes.sql:/docker-entrypoint-initdb.d/schema_cartoes.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
