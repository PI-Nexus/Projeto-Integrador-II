services:
  mysql:
    image: mysql:9.7
    container_name: mysql-cartoes
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "${PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/schema_cartoes.sql:/docker-entrypoint-initdb.d/schema_cartoes.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    container_name: python_API
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${DATABASE}
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app

volumes:
  mysql_data:
